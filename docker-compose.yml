name: onemusiccrate

services:
  postgres:
    image: postgres:16-alpine
    container_name: onemusiccrate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: onemusiccrate
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - onemusiccrate-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d onemusiccrate"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  onemusiccrate-postgres-data:
